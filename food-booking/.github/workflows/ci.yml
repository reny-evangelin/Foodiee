name: Food Booking Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-syntax-check:
    name: Validate Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r food-booking/backend/requirements.txt

      - name: Check compilation syntax
        run: |
          python -m py_compile food-booking/backend/app/main.py \
                               food-booking/backend/app/database.py \
                               food-booking/backend/app/models.py \
                               food-booking/backend/app/schemas.py \
                               food-booking/backend/app/routes/orders.py \
                               food-booking/backend/app/routes/products.py \
                               food-booking/backend/app/services/order_service.py \
                               food-booking/backend/app/services/billing_service.py \
                               food-booking/backend/seed.py

  docker-build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: python-syntax-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./food-booking/backend
          file: ./food-booking/backend/Dockerfile
          push: false
