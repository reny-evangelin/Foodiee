services:

  # 1. Backend FastAPI Service
  backend:
    build:
      context: ./food-booking/backend
      dockerfile: Dockerfile
    container_name: foodiee_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./database.db
    volumes:
      - ./food-booking/backend/database.db:/backend/database.db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/products\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Frontend Nginx Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodiee_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: foodiee_network
