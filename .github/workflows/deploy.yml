name: Foodiee DevOps CI/CD & Docker Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: 1. Python & Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r food-booking/backend/requirements.txt

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile food-booking/backend/app/main.py \
                               food-booking/backend/app/database.py \
                               food-booking/backend/app/models.py \
                               food-booking/backend/app/schemas.py \
                               food-booking/backend/app/routes/orders.py \
                               food-booking/backend/app/routes/products.py \
                               food-booking/backend/app/services/order_service.py \
                               food-booking/backend/app/services/billing_service.py \
                               food-booking/backend/seed.py

  docker-build-and-deploy:
    name: 2. Build & Deploy Docker Containers
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./food-booking/backend
          file: ./food-booking/backend/Dockerfile
          push: false
          tags: foodiee-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: foodiee-frontend:latest

      - name: Verify Docker Compose Configuration
        run: |
          docker-compose config
